  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ass=\"TOG ON\" onclick=\"this.classList.toggle('ON')\"><\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"CARD\" style=\"margin-bottom:8px\">\n      <div class=\"LBL\">Sincronizzazione<\u002Fdiv><div class=\"DIV\"><\u002Fdiv>\n      <div class=\"SETR\" style=\"border-bottom:none;padding:8px 0 4px\"><div><div class=\"SETN\">Stato sync<\u002Fdiv><div class=\"SETS\" id=\"se-syncst\">--<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--t3);line-height:1.6;padding:2px 0 10px\">Per sincronizzare tra più dispositivi incolla qui il blocco <b style=\"color:var(--t2)\">firebaseConfig<\u002Fb> dalla Console Firebase (Impostazioni progetto &gt; App Web &gt; SDK setup). Puoi incollarlo con o senza le graffe { }.<\u002Fdiv>\n      <textarea class=\"INP\" id=\"se-fbcfg\" rows=\"5\" placeholder=\"{ apiKey: &quot;...&quot;, projectId: &quot;...&quot;, ... }\" style=\"resize:none;font-family:var(--mo);font-size:11px;line-height:1.5;margin-bottom:8px\"><\u002Ftextarea>\n      <button class=\"BTN BS\" style=\"width:auto;padding:10px 18px;border-radius:var(--rs)\" onclick=\"saveFbCfg()\">Salva e riavvia<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"CARD\" style=\"margin-bottom:8px\">\n      <div class=\"LBL\">Info<\u002Fdiv><div class=\"DIV\"><\u002Fdiv>\n      <div class=\"SETR\"><div><div class=\"SETN\">Versione<\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;color:var(--t3);font-family:var(--mo)\">1.0.3<\u002Fdiv><\u002Fdiv>\n      <div class=\"SETR\" style=\"border-bottom:none\"><div><div class=\"SETN\">Storage<\u002Fdiv><div class=\"SETS\">Firebase Firestore - gratuito<\u002Fdiv><\u002Fdiv><span class=\"BDG BOK\">Free<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"BTN BD\" onclick=\"doLogout()\">Esci<\u002Fbutton>\n    <div style=\"height:10px\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"BNV\">\n    <button class=\"NBT\" data-nav=\"sc-ho\" onclick=\"nav('sc-ho')\"><span class=\"NI\">🏠<\u002Fspan><span class=\"NL\">Casa<\u002Fspan><\u002Fbutton>\n    <button class=\"NBT\" data-nav=\"sc-ha\" onclick=\"nav('sc-ha')\"><span class=\"NI\">🤝<\u002Fspan><span class=\"NL\">Turno<\u002Fspan><\u002Fbutton>\n    <button class=\"NBT\" data-nav=\"sc-fa\" onclick=\"nav('sc-fa')\"><span class=\"NI\">👪<\u002Fspan><span class=\"NL\">Famiglia<\u002Fspan><\u002Fbutton>\n    <button class=\"NBT\" data-nav=\"sc-se\" onclick=\"nav('sc-se')\"><span class=\"NI\">⚙<\u002Fspan><span class=\"NL\">Impostazioni<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"SC\" id=\"sc-st\">\n  <div class=\"SB\"><span class=\"ST\" id=\"t-st\"><\u002Fspan><\u002Fdiv>\n  <div class=\"SHDR\">\n    <button class=\"BG\" onclick=\"nav('sc-ho','nb-ho')\" style=\"font-size:18px;color:var(--t3)\">←<\u002Fbutton>\n    <span class=\"STIT\">🔍 Storico<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"KSL\" id=\"st-ks\"><\u002Fdiv>\n  <div style=\"padding:10px 14px 0;flex-shrink:0;background:var(--bg)\">\n    <input class=\"INP\" id=\"st-q\" type=\"text\" placeholder=\"Cerca per testo, tipo o caregiver...\" oninput=\"runSearch()\">\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:10px\" id=\"st-tp\">\n      <button class=\"PIL SL\" data-val=\"all\" onclick=\"selPil('st-tp',this);runSearch()\">Tutti<\u002Fbutton>\n      <button class=\"PIL\" data-val=\"feed\" onclick=\"selPil('st-tp',this);runSearch()\">Poppata<\u002Fbutton>\n      <button class=\"PIL\" data-val=\"diap\" onclick=\"selPil('st-tp',this);runSearch()\">Pannolino<\u002Fbutton>\n      <button class=\"PIL\" data-val=\"sleep\" onclick=\"selPil('st-tp',this);runSearch()\">Sonno<\u002Fbutton>\n      <button class=\"PIL\" data-val=\"med\" onclick=\"selPil('st-tp',this);runSearch()\">Medicina<\u002Fbutton>\n      <button class=\"PIL\" data-val=\"note\" onclick=\"selPil('st-tp',this);runSearch()\">Nota<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"BODY\" style=\"padding-top:10px\">\n    <div class=\"CARD\"><div class=\"EL\" id=\"st-ls\"><div class=\"EMP\"><div>🔍<\u002Fdiv>Nessun evento<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div id=\"TST\">\n  <div style=\"font-size:20px\" id=\"t-ico\">+<\u002Fdiv>\n  <div><div class=\"TT\" id=\"t-ttl\">OK<\u002Fdiv><div class=\"TS\" id=\"t-sub\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"1640d23b-9f49-4758-8c72-1d8dc8d728d0\"><\u002Fscript>\n<script src=\"0707d1d7-b30b-4c2c-86c6-a63d0c6a0da1\"><\u002Fscript>\n<script src=\"b27a6884-65e0-48b4-b560-b988e6a465f5\"><\u002Fscript>\n\n<script>\nvar FBCFG={\n  apiKey:\"AIzaSyDemo_Replace_With_Your_Key\",\n  authDomain:\"infurnas-family.firebaseapp.com\",\n  projectId:\"infurnas-family\",\n  storageBucket:\"infurnas-family.appspot.com\",\n  messagingSenderId:\"123456789\",\n  appId:\"1:123456789:web:abcdef123456\"\n};\nvar ST={\n  sc:null,psc:null,\n  fb:null,au:null,db:null,fbOk:false,\n  usr:null,prof:null,\n  kids:[],kid:0,\n  evs:[],meds:[],\n  slpA:null,\n  uns:[],\n  fqty:80,fsec:0,frun:false,fint:null,fstartTs:null,fstart0:null,\n  sint:null,\n  vrun:false,vint:null,vsec:0,\n  dtpe:null,\n  amode:'login',\n  authing:false\n};\nvar EMOJ=['[baby]','[chick]','[star]'];\n\nfunction lsG(k){try{return JSON.parse(localStorage.getItem('if2_'+k));}catch(e){return null;}}\nfunction lsS(k,v){try{localStorage.setItem('if2_'+k,JSON.stringify(v));}catch(e){}}\nfunction lsD(k){try{localStorage.removeItem('if2_'+k);}catch(e){}}\n\nfunction init(){\n  setLt('Connessione Firebase...');\n  var storedCfg=lsG('fbcfg');\n  if(storedCfg&&storedCfg.apiKey) FBCFG=storedCfg;\n  var cfgOk=FBCFG.apiKey&&FBCFG.apiKey.indexOf('Demo')<0&&FBCFG.apiKey.indexOf('Replace')<0;\n  try{\n    if(!cfgOk) throw new Error('config');\n    if(!firebase.apps.length) firebase.initializeApp(FBCFG);\n    ST.fb=firebase; ST.au=firebase.auth(); ST.db=firebase.firestore();\n    ST.fbOk=true;\n    setLt('Controllo sessione...');\n  }catch(e){\n    ST.fbOk=false;\n    setLt('Modalita offline');\n  }\n  startClock();\n  loadLocal();\n  restoreFeedT();\n  if(ST.fbOk){\n    ST.au.onAuthStateChanged(function(u){\n      if(u){\n        ST.usr=u;\n        if(ST.authing) return;\n        loadProf(u.uid,function(){\n          hideLdr();\n          if(!ST.prof||!ST.kids.length) go('sc-ob');\n          else startApp();\n        });\n      }else{\n        hideLdr();\n        var lu=lsG('usr');\n        if(lu&&ST.prof){ST.usr=lu;startApp();}\n        else go(lsG('seen')?'sc-au':'sc-ob');\n      }\n    });\n  }else{\n    setTimeout(function(){\n      hideLdr();\n      var lu=lsG('usr');\n      if(lu&&ST.prof){ST.usr=lu;startApp();}\n      else go('sc-au');\n    },600);\n  }\n}\n\nfunction loadLocal(){\n  ST.prof=lsG('prof'); ST.kids=lsG('kids')||[];\n  ST.evs=lsG('evs')||[]; ST.meds=lsG('meds')||[];\n  ST.slpA=lsG('slpA'); ST.kid=lsG('kid')||0;\n  if(ST.kid>=ST.kids.length) ST.kid=0;\n}\n\nfunction loadProf(uid,cb){\n  if(!ST.db){cb&&cb();return;}\n  ST.db.collection('users').doc(uid).get().then(function(s){\n    if(s.exists){\n      var d=s.data();\n      ST.prof={name:d.name||'',fc:d.fc||''};\n      ST.kids=d.kids||[]; ST.meds=d.meds||[];\n      lsS('prof',ST.prof); lsS('kids',ST.kids); lsS('meds',ST.meds);\n    }\n    cb&&cb();\n  }).catch(function(){cb&&cb();});\n}\n\nfunction startApp(){\n  renderKS(); subEvs(); subCGs(); go('sc-ho'); updHome(); syncSlpUI();\n}\n\nfunction subEvs(){\n  if(!ST.db||!ST.prof||!ST.prof.fc) return;\n  var u=ST.db.collection('evs').where('fc','==',ST.prof.fc)\n    .onSnapshot(function(s){\n      ST.evs=s.docs.map(function(d){\n        var e=d.data(); e.id=d.id;\n        if(e.ts&&e.ts.toMillis) e.ts=e.ts.toMillis();\n        return e;\n      }).sort(function(a,b){return (b.ts||0)-(a.ts||0);});\n      lsS('evs',ST.evs.slice(0,300));\n      updHome(); updDiCnt(); updSlpTot(); updHO(); updNotes(); setSync(true);\n    },function(err){setSync(false);ST.syncErr=(err&&err.code)||'errore';});\n  ST.uns.push(u);\n}\n\nfunction subCGs(){\n  if(!ST.db||!ST.prof||!ST.prof.fc) return;\n  var u=ST.db.collection('users').where('fc','==',ST.prof.fc)\n    .onSnapshot(function(s){renderCGs(s.docs.map(function(d){return d.data();}));},function(err){\n      ST.syncErr=(err&&err.code)||'errore';\n      var el=document.getElementById('fa-ls');\n      if(el) el.innerHTML='<div class=\"EMP\"><div>&#9888;<\u002Fdiv>Lettura bloccata da Firestore ('+((err&&err.code)||'errore')+').<br/>Apri Console Firebase &gt; Firestore &gt; Regole e consenti la lettura agli utenti autenticati.<\u002Fdiv>';\n    });\n  ST.uns.push(u);\n}\n\nfunction setSync(ok){\n  var d=document.getElementById('sync-d');\n  if(d) d.style.background=ok?'var(--grn)':'var(--red)';\n}\n\n/* ---- AUTH ---- */\nfunction toggleAuth(){\n  ST.amode=ST.amode==='login'?'register':'login';\n  document.getElementById('a-btntxt').textContent=ST.amode==='login'?'Accedi':'Registrati';\n  document.getElementById('a-swlbl').textContent=ST.amode==='login'?'Registrati':'Accedi';\n  document.getElementById('a-err').style.display='none';\n}\n\nfunction doLogin(){\n  var em=document.getElementById('a-em').value.trim();\n  var pw=document.getElementById('a-pw').value;\n  var err=document.getElementById('a-err');\n  err.style.display='none';\n  if(!em||!pw){err.textContent='Inserisci email e password';err.style.display='block';return;}\n  document.getElementById('a-btntxt').textContent='...';\n  ST.authing=true;\n  function ok(u){\n    ST.authing=false;\n    ST.usr=u; lsS('usr',{uid:u.uid,email:u.email});\n    loadProf(u.uid,function(){\n      if(!ST.prof||!ST.kids.length) go('sc-su');\n      else startApp();\n    });\n  }\n  function fail(e){\n    ST.authing=false;\n    var m={\n      'auth/user-not-found':'Account non trovato.',\n      'auth/wrong-password':'Password errata.',\n      'auth/invalid-credential':'Email o password errati.',\n      'auth/email-already-in-use':'Email gia registrata.',\n      'auth/invalid-email':'Email non valida.',\n      'auth/weak-password':'Password troppo corta (min 6).',\n      'auth/network-request-failed':'Nessuna connessione. Uso offline.'\n    };\n    err.textContent=m[e.code]||('Errore: '+e.message);\n    err.style.display='block';\n    document.getElementById('a-btntxt').textContent=ST.amode==='login'?'Accedi':'Registrati';\n    if(e.code==='auth/network-request-failed'&&ST.prof){\n      ST.usr={uid:'local_'+em,email:em}; lsS('usr',ST.usr); ST.fbOk=false; startApp();\n    }\n  }\n  if(ST.fbOk){\n    var p=ST.amode==='register'\n      ?ST.au.createUserWithEmailAndPassword(em,pw)\n      :ST.au.signInWithEmailAndPassword(em,pw);\n    p.then(function(c){ok(c.user);}).catch(fail);\n  }else{\n    ST.usr={uid:'local_'+em,email:em}; lsS('usr',ST.usr);\n    if(!ST.prof||!ST.kids.length) go('sc-su'); else startApp();\n  }\n}\n\nfunction doLogout(){\n  ST.uns.forEach(function(u){try{u();}catch(e){}});\n  ST.uns=[];\n  if(ST.fbOk&&ST.au&&ST.au.currentUser) ST.au.signOut().catch(function(){});\n  lsD('usr'); ST.usr=null; ST.prof=null; ST.kids=[]; ST.evs=[];\n  go('sc-au'); toast('Uscito','A presto!');\n}\n\n/* ---- SETUP ---- */\nfunction saveSetup(){\n  var nm=document.getElementById('su-nm').value.trim();\n  var c1=document.getElementById('su-c1').value.trim();\n  var c2=document.getElementById('su-c2').value.trim();\n  var c3=document.getElementById('su-c3').value.trim();\n  var fc=document.getElementById('su-fc').value.trim().toLowerCase().replace(/\\s+/g,'');\n  if(!nm){toast('Inserisci il tuo nome','');return;}\n  if(!c1){toast('Inserisci almeno un bambino','');return;}\n  if(!fc) fc='fam-'+Math.random().toString(36).slice(2,8);\n  var kids=[c1,c2,c3].filter(function(n){return n.length>0;}).slice(0,3)\n    .map(function(n,i){return{name:n,em:EMOJ[i]};});\n  ST.prof={name:nm,fc:fc}; ST.kids=kids;\n  lsS('prof',ST.prof); lsS('kids',kids);\n  if(ST.db&&ST.usr){\n    ST.db.collection('users').doc(ST.usr.uid).set({\n      name:nm,fc:fc,kids:kids,email:ST.usr.email||'',\n      lastSeen:firebase.firestore.FieldValue.serverTimestamp(),meds:[]\n    }).catch(function(){});\n  }\n  toast('Profilo salvato!','Benvenuto!');\n  startApp();\n}\n\n/* ---- SETTINGS ---- */\nfunction saveKids(){\n  var c1=document.getElementById('se-c1').value.trim();\n  var c2=document.getElementById('se-c2').value.trim();\n  var c3=document.getElementById('se-c3').value.trim();\n  var kids=[c1,c2,c3].filter(function(n){return n.length>0;}).slice(0,3)\n    .map(function(n,i){return{name:n,em:EMOJ[i]};});\n  if(!kids.length) return;\n  ST.kids=kids; if(ST.kid>=kids.length) ST.kid=0;\n  lsS('kids',kids); lsS('kid',ST.kid);\n  if(ST.db&&ST.usr) ST.db.collection('users').doc(ST.usr.uid).update({kids:kids}).catch(function(){});\n  renderKS(); updKL();\n}\n\nfunction editName(){\n  var n=prompt('Il tuo nome:',ST.prof?ST.prof.name:'');\n  if(!n||!n.trim()) return;\n  n=n.trim(); ST.prof.name=n; lsS('prof',ST.prof);\n  var el=document.getElementById('se-nm'); if(el) el.textContent=n;\n  var hel=document.getElementById('hdr-cg'); if(hel) hel.textContent='Ciao, '+n;\n  if(ST.db&&ST.usr) ST.db.collection('users').doc(ST.usr.uid).update({name:n}).catch(function(){});\n  toast('Nome aggiornato','');\n}\n\nfunction copyFC(){\n  var fc=ST.prof?ST.prof.fc:'';\n  if(navigator.clipboard) navigator.clipboard.writeText(fc).catch(function(){});\n  toast('Codice copiato!',fc);\n}\nfunction editFC(){\n  if(!ST.prof) return;\n  var v=document.getElementById('fa-codeview'); var e=document.getElementById('fa-codeedit');\n  var i=document.getElementById('fa-fcin'); if(i) i.value=ST.prof.fc||'';\n  if(v) v.style.display='none'; if(e) e.style.display='';\n  if(i) i.focus();\n}\nfunction editFCcancel(){\n  var v=document.getElementById('fa-codeview'); var e=document.getElementById('fa-codeedit');\n  if(v) v.style.display=''; if(e) e.style.display='none';\n}\nfunction saveFCin(){\n  if(!ST.prof) return;\n  var i=document.getElementById('fa-fcin'); if(!i) return;\n  var n=i.value.trim().toLowerCase().replace(/\\s+/g,'');\n  if(!n){toast('Codice non valido','');return;}\n  ST.prof.fc=n; lsS('prof',ST.prof);\n  if(ST.db&&ST.usr) ST.db.collection('users').doc(ST.usr.uid).update({fc:n}).catch(function(){});\n  ST.uns.forEach(function(u){try{u();}catch(e){}}); ST.uns=[];\n  if(ST.fbOk){subEvs();subCGs();}\n  var a=document.getElementById('se-fc'); if(a) a.textContent=n;\n  var b=document.getElementById('fa-code'); if(b) b.textContent=n;\n  editFCcancel(); updHome(); toast('Codice aggiornato',n);\n}\n\nfunction loadSeUI(){\n  var nm=document.getElementById('se-nm'); if(nm) nm.textContent=ST.prof?ST.prof.name:'--';\n  var em=document.getElementById('se-em'); if(em) em.textContent=ST.usr?ST.usr.email:'--';\n  var fc=document.getElementById('se-fc'); if(fc) fc.textContent=ST.prof?ST.prof.fc:'--';\n  var c1=document.getElementById('se-c1'); if(c1) c1.value=ST.kids[0]?ST.kids[0].name:'';\n  var c2=document.getElementById('se-c2'); if(c2) c2.value=ST.kids[1]?ST.kids[1].name:'';\n  var c3=document.getElementById('se-c3'); if(c3) c3.value=ST.kids[2]?ST.kids[2].name:'';\n  var fac=document.getElementById('fa-code'); if(fac) fac.textContent=ST.prof?ST.prof.fc:'--';\n  var ss=document.getElementById('se-syncst');\n  if(ss){\n    if(ST.syncErr) ss.textContent='Errore lettura: '+ST.syncErr+' - controlla le Regole Firestore';\n    else if(ST.fbOk) ss.textContent='Connesso - '+(FBCFG.projectId||'')+' - '+(ST.usr?ST.usr.email:'');\n    else ss.textContent='Offline (solo questo dispositivo)';\n  }\n}\n\n/* ---- KIDS ---- */\nfunction renderKS(){\n  ['ho-ks','ha-ks','st-ks'].forEach(function(id){\n    var el=document.getElementById(id); if(!el) return;\n    el.innerHTML='';\n    ST.kids.forEach(function(k,i){\n      var b=document.createElement('button');\n      b.className='KCH'+(i===ST.kid?' ON':'');\n      b.setAttribute('data-i',i);\n      b.textContent=k.name;\n      b.onclick=function(){selKid(i);};\n      el.appendChild(b);\n    });\n  });\n  updKL();\n}\n\nfunction selKid(i){\n  ST.kid=i; lsS('kid',i);\n  document.querySelectorAll('.KCH').forEach(function(c){\n    c.classList.toggle('ON',parseInt(c.getAttribute('data-i'))===i);\n  });\n  updKL(); updHome(); updDiCnt(); updSlpTot(); updHO(); updNotes(); refMeds();\n}\n\nfunction updKL(){\n  var k=ST.kids[ST.kid]; var l=k?k.name:'';\n  ['fe-kl','di-kl','sl-kl','me-kl','no-kl'].forEach(function(id){\n    var el=document.getElementById(id); if(el) el.textContent=l;\n  });\n}\n\nfunction kidNm(){return ST.kids[ST.kid]?ST.kids[ST.kid].name:'Bambino';}\nfunction kidI(){return ST.kid;}\n\n/* ---- LOG EVENT ---- */\nfunction logEv(type,data,cb,tsOv){\n  var ts=tsOv||Date.now();\n  var ev=Object.assign({type:type,ki:kidI(),kn:kidNm(),fc:ST.prof?ST.prof.fc:'local',cg:ST.prof?ST.prof.name:'Utente',ts:ts},data);\n  ST.evs.unshift(ev); ST.evs.sort(function(a,b){return (b.ts||0)-(a.ts||0);});\n  lsS('evs',ST.evs.slice(0,300)); updHome();\n  if(ST.db&&ST.prof&&ST.prof.fc){\n    var de=Object.assign({},ev,{ts:tsOv?firebase.firestore.Timestamp.fromMillis(tsOv):firebase.firestore.FieldValue.serverTimestamp()});\n    ST.db.collection('evs').add(de).then(function(r){ev.id=r.id;cb&&cb(ev);}).catch(function(){cb&&cb(ev);});\n  }else{cb&&cb(ev);}\n}\n\n/* ---- BACKDATE (registrazione a orario personalizzato) ---- */\nfunction nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}\nfunction bdTs(pfx){var p=document.getElementById(pfx+'-bd');if(!p||p.style.display==='none') return null;var v=(document.getElementById(pfx+'-bt')||{}).value;if(!v) return null;var t=new Date(v).getTime();return isNaN(t)?null:t;}\nfunction togBackdate(pfx){\n  var p=document.getElementById(pfx+'-bd');if(!p) return;\n  var show=p.style.display==='none';\n  p.style.display=show?'':'none';\n  var b=document.getElementById(pfx+'-plus');if(b) b.classList.toggle('ON',show);\n  if(show){\n    if(pfx==='sl'){var i1=document.getElementById('sl-bt1');if(i1&&!i1.value) i1.value=nowLocal();var i2=document.getElementById('sl-bt2');if(i2&&!i2.value) i2.value=nowLocal();}\n    else{var i=document.getElementById(pfx+'-bt');if(i&&!i.value) i.value=nowLocal();}\n  }\n}\nfunction hideBackdate(pfx){\n  var p=document.getElementById(pfx+'-bd');if(p) p.style.display='none';\n  var b=document.getElementById(pfx+'-plus');if(b) b.classList.remove('ON');\n  ['-bt','-bt1','-bt2'].forEach(function(sx){var i=document.getElementById(pfx+sx);if(i) i.value='';});\n}\nfunction addPastSleep(){\n  var s=(document.getElementById('sl-bt1')||{}).value;\n  var e=(document.getElementById('sl-bt2')||{}).value;\n  if(!s||!e){toast('Inserisci inizio e fine','');return;}\n  var st=new Date(s).getTime(),en=new Date(e).getTime();\n  if(isNaN(st)||isNaN(en)||en<=st){toast('Intervallo non valido','La fine deve essere dopo l inizio');return;}\n  var dur=Math.floor((en-st)/1000);\n  logEv('slps',{st:st},function(){},st);\n  logEv('slpe',{st:st,dur:dur},function(){updSlpTot();updHome();toast('Sessione aggiunta','Durata: '+fDur(dur));},en);\n  hideBackdate('sl');\n}\n\n/* ---- HOME ---- */\nfunction updHome(){\n  var ci=kidI(); var kn=kidNm();\n  var evs=ST.evs.filter(function(e){return e.ki===ci||e.kn===kn;});\n  var lf=null,ld=null,lse=null;\n  for(var i=0;i<evs.length;i++){\n    if(!lf&&evs[i].type==='feed') lf=evs[i];\n    if(!ld&&evs[i].type==='diap') ld=evs[i];\n    if(!lse&&evs[i].type==='slpe') lse=evs[i];\n  }\n  var slp=ST.slpA&&(ST.slpA.ki===ci||ST.slpA.kn===kn);\n  var tod=new Date(); tod.setHours(0,0,0,0);\n  var mc=evs.filter(function(e){return e.type==='med'&&e.ts>=tod.getTime();}).length;\n  var fa=lf?mAgo(lf.ts):999;\n  var g=document.getElementById('ho-sg'); if(!g) return;\n  g.innerHTML=\n    '<div class=\"CARD '+(fa>180?'CAMB':'')+'\" onclick=\"go(\\'sc-fe\\')\" style=\"cursor:pointer\">'+\n      '<div class=\"LBL\">Ultima poppata<\u002Fdiv>'+\n      '<div class=\"VAL\">'+(lf?tAgo(lf.ts):'--')+'<\u002Fdiv>'+\n      '<div class=\"SUB\">'+(lf?fFT(lf.ft)+' - '+(lf.ml||'?')+'ml'+((lf.st&&lf.dur)?' - '+fT(lf.st)+'-'+fT(lf.ts):''):'Nessuna')+'<\u002Fdiv>'+\n    '<\u002Fdiv>'+\n    '<div class=\"CARD\" onclick=\"go(\\'sc-di\\')\" style=\"cursor:pointer\">'+\n      '<div class=\"LBL\">Ultimo pannolino<\u002Fdiv>'+\n      '<div class=\"VAL\">'+(ld?tAgo(ld.ts):'--')+'<\u002Fdiv>'+\n      '<div class=\"SUB\">'+(ld?fDiap(ld.dt):'Nessuno')+'<\u002Fdiv>'+\n    '<\u002Fdiv>'+\n    '<div class=\"CARD '+(slp?'CGRN':'')+'\" onclick=\"go(\\'sc-sl\\')\" style=\"cursor:pointer\">'+\n      '<div class=\"LBL\">Sonno<\u002Fdiv>'+\n      '<div class=\"VAL\" style=\"color:'+(slp?'var(--grn)':'var(--t1)')+'\">'+(slp?'Dorme':'Sveglio')+'<\u002Fdiv>'+\n      '<div class=\"SUB\">'+(slp?'da '+tAgo(ST.slpA.st):(lse?'Ultima: '+tAgo(lse.ts):'Nessuna'))+'<\u002Fdiv>'+\n    '<\u002Fdiv>'+\n    '<div class=\"CARD\" onclick=\"go(\\'sc-me\\')\" style=\"cursor:pointer\">'+\n      '<div class=\"LBL\">Medicine oggi<\u002Fdiv>'+\n      '<div class=\"VAL\">'+mc+'<\u002Fdiv>'+\n      '<div class=\"SUB\">somministrate oggi<\u002Fdiv>'+\n    '<\u002Fdiv>';\n  var he=document.getElementById('ho-ev'); if(!he) return;\n  var rec=evs.slice(0,8);\n  if(!rec.length){he.innerHTML='<div class=\"EMP\"><div>&#128203;<\u002Fdiv>Nessun evento ancora<\u002Fdiv>';return;}\n  he.innerHTML=rec.map(function(e){\n    return '<div class=\"EI\">'+\n      '<div class=\"ED\" style=\"background:'+eCol(e.type)+'\"><\u002Fdiv>'+\n      '<div class=\"ET\">'+eLbl(e)+'<\u002Fdiv>'+\n      '<div><div class=\"EC\">'+fT(e.ts)+'<\u002Fdiv><div class=\"EW\">'+(e.cg||'')+'<\u002Fdiv><\u002Fdiv>'+\n    '<\u002Fdiv>';\n  }).join('');\n  var hc=document.getElementById('hdr-cg');\n  if(hc&&ST.prof) hc.textContent='Ciao, '+ST.prof.name;\n}\n\n/* ---- FEED ---- */\nfunction chQty(d){ST.fqty=Math.max(10,Math.min(500,ST.fqty+d));document.getElementById('qv').textContent=ST.fqty;}\nfunction setQty(v){ST.fqty=v;document.getElementById('qv').textContent=v;}\nfunction feedElapsed(){return ST.fsec+(ST.fstartTs?Math.floor((Date.now()-ST.fstartTs)/1000):0);}\nfunction saveFeedT(){lsS('feedT',{fsec:ST.fsec,fstartTs:ST.fstartTs,fstart0:ST.fstart0});}\nfunction feedTick(){var el=document.getElementById('fe-ti');if(el) el.textContent=fSec(feedElapsed());}\nfunction togFT(){\n  var b=document.getElementById('fe-tb');\n  if(ST.frun){\n    ST.fsec=feedElapsed();ST.fstartTs=null;ST.frun=false;\n    clearInterval(ST.fint);\n    if(b) b.textContent='Riprendi';\n  }else{\n    if(!ST.fstart0) ST.fstart0=Date.now();\n    ST.fstartTs=Date.now();ST.frun=true;\n    if(b) b.textContent='Pausa';\n    clearInterval(ST.fint);\n    ST.fint=setInterval(feedTick,1000);\n  }\n  saveFeedT();feedTick();\n}\nfunction restoreFeedT(){\n  var f=lsG('feedT');\n  if(f){ST.fsec=f.fsec||0;ST.fstartTs=f.fstartTs||null;ST.fstart0=f.fstart0||null;ST.frun=!!ST.fstartTs;}\n  var b=document.getElementById('fe-tb');\n  if(b) b.textContent=ST.frun?'Pausa':(ST.fsec>0?'Riprendi':'Avvia');\n  feedTick();\n  clearInterval(ST.fint);\n  if(ST.frun) ST.fint=setInterval(feedTick,1000);\n}\nfunction rstFT(){\n  clearInterval(ST.fint);ST.frun=false;ST.fsec=0;ST.fstartTs=null;ST.fstart0=null;lsD('feedT');\n  var el=document.getElementById('fe-ti'); if(el) el.textContent='00:00';\n  var b=document.getElementById('fe-tb'); if(b) b.textContent='Avvia';\n}\nfunction logFeed(){\n  var s=document.querySelector('#fe-tp .SL');\n  var ft=s?s.getAttribute('data-val'):'bottle';\n  var dur=feedElapsed();\n  var tsOv=bdTs('fe');\n  var end=tsOv||Date.now();\n  var start=tsOv?end:(ST.fstart0||(dur>0?end-dur*1000:end));\n  if(tsOv) dur=0;\n  clearInterval(ST.fint);ST.frun=false;ST.fsec=0;ST.fstartTs=null;ST.fstart0=null;lsD('feedT');\n  hideBackdate('fe');\n  logEv('feed',{ft:ft,ml:ST.fqty,dur:dur,st:start},function(){\n    rstFT(); toast('Poppata registrata!',ST.fqty+'ml - '+kidNm()); go('sc-ho');\n  },tsOv);\n}\nfunction selPil(gid,btn){\n  document.querySelectorAll('#'+gid+' .PIL').forEach(function(p){p.classList.remove('SL');});\n  btn.classList.add('SL');\n}\n\n/* ---- DIAPER ---- */\nfunction selDi(t){\n  ST.dtpe=t;\n  ['dp-pe','dp-po','dp-bo'].forEach(function(id){\n    var el=document.getElementById(id); if(!el) return;\n    el.style.background=''; el.style.border='.5px solid var(--bdr)';\n  });\n  var cols={pee:'rgba(245,158,11,.15)',poop:'rgba(139,90,43,.1)',both:'rgba(16,185,129,.1)'};\n  var bcols={pee:'rgba(245,158,11,.4)',poop:'rgba(139,90,43,.35)',both:'rgba(16,185,129,.3)'};\n  var id={pee:'dp-pe',poop:'dp-po',both:'dp-bo'}[t];\n  var el=document.getElementById(id);\n  if(el){el.style.background=cols[t];el.style.border='.5px solid '+bcols[t];}\n}\nfunction logDi(){\n  if(!ST.dtpe){toast('Seleziona tipo pannolino','');return;}\n  var dt=ST.dtpe; ST.dtpe=null;\n  ['dp-pe','dp-po','dp-bo'].forEach(function(id){var el=document.getElementById(id);if(el){el.style.background='';el.style.border='.5px solid var(--bdr)';}});\n  var tsOv=bdTs('di'); hideBackdate('di');\n  logEv('diap',{dt:dt},function(){toast('Pannolino registrato!',fDiap(dt)+' - '+kidNm());updDiCnt();go('sc-ho');},tsOv);\n}\nfunction updDiCnt(){\n  var tod=new Date(); tod.setHours(0,0,0,0);\n  var ci=kidI(); var kn=kidNm();\n  var evs=ST.evs.filter(function(e){return e.type==='diap'&&(e.ki===ci||e.kn===kn)&&e.ts>=tod.getTime();});\n  var pe=0,po=0;\n  evs.forEach(function(e){if(e.dt==='pee'||e.dt==='both')pe++;if(e.dt==='poop'||e.dt==='both')po++;});\n  var ep=document.getElementById('dc-pe'); if(ep) ep.textContent=pe;\n  var epo=document.getElementById('dc-po'); if(epo) epo.textContent=po;\n  var et=document.getElementById('dc-to'); if(et) et.textContent=evs.length;\n}\n\n/* ---- SLEEP ---- */\nfunction startSlp(){\n  var now=Date.now();\n  ST.slpA={st:now,ki:kidI(),kn:kidNm()}; lsS('slpA',ST.slpA);\n  logEv('slps',{st:now},function(){});\n  syncSlpUI(); updHome(); toast('Nanna iniziata!',kidNm());\n}\nfunction endSlp(){\n  if(!ST.slpA) return;\n  var dur=Math.floor((Date.now()-ST.slpA.st)/1000); var st=ST.slpA.st;\n  ST.slpA=null; lsD('slpA'); clearInterval(ST.sint);\n  logEv('slpe',{st:st,dur:dur},function(){syncSlpUI();updSlpTot();updHome();toast('Nanna terminata!','Durata: '+fDur(dur));});\n}\nfunction syncSlpUI(){\n  var ci=kidI(); var kn=kidNm();\n  var slp=ST.slpA&&(ST.slpA.ki===ci||ST.slpA.kn===kn);\n  var ac=document.getElementById('sl-ac');\n  var sw=document.getElementById('sl-sw');\n  var ew=document.getElementById('sl-ew');\n  var sl=document.getElementById('sl-sl');\n  if(ac) ac.style.display=slp?'':'none';\n  if(sw) sw.style.display=slp?'none':'';\n  if(ew) ew.style.display=slp?'':'none';\n  if(sl&&slp) sl.textContent='Inizio: '+fT(ST.slpA.st);\n  clearInterval(ST.sint);\n  if(slp){\n    ST.sint=setInterval(function(){\n      var s=Math.floor((Date.now()-ST.slpA.st)/1000);\n      var el=document.getElementById('sl-ti'); if(el) el.textContent=fHMS(s);\n    },1000);\n  }\n}\nfunction updSlpTot(){\n  var tod=new Date(); tod.setHours(0,0,0,0);\n  var ci=kidI(); var kn=kidNm();\n  var evs=ST.evs.filter(function(e){return e.type==='slpe'&&(e.ki===ci||e.kn===kn)&&e.ts>=tod.getTime();});\n  var tot=0; evs.forEach(function(e){tot+=e.dur||0;});\n  if(ST.slpA&&(ST.slpA.ki===ci||ST.slpA.kn===kn)) tot+=Math.floor((Date.now()-ST.slpA.st)/1000);\n  var pct=Math.min(100,Math.round(tot/(16*3600)*100));\n  var e1=document.getElementById('sl-to'); if(e1) e1.textContent=fDur(tot);\n  var e2=document.getElementById('sl-pc'); if(e2) e2.textContent=pct+'%';\n  var rg=document.getElementById('sl-rg');\n  if(rg){var deg=Math.round(pct*3.6);rg.style.background='conic-gradient(var(--grn) 0deg '+deg+'deg,var(--s2) '+deg+'deg 360deg)';}\n  var ls=document.getElementById('sl-ls'); if(!ls) return;\n  if(!evs.length){ls.innerHTML='<div class=\"EMP\"><div>&#128564;<\u002Fdiv>Nessuna sessione oggi<\u002Fdiv>';return;}\n  ls.innerHTML=evs.map(function(e){\n    return '<div class=\"CARD\" style=\"margin-bottom:8px;display:flex;align-items:center;gap:10px\">'+\n      '<div style=\"font-size:20px\">&#127769;<\u002Fdiv>'+\n      '<div style=\"flex:1\"><div style=\"font-size:13px;font-weight:500\">'+fDur(e.dur||0)+'<\u002Fdiv>'+\n      '<div style=\"font-size:11px;color:var(--t3)\">'+fT(e.st||e.ts)+' > '+fT(e.ts)+'<\u002Fdiv><\u002Fdiv>'+\n      '<span style=\"font-size:11px;color:var(--t3)\">'+(e.cg||'')+'<\u002Fspan>'+\n    '<\u002Fdiv>';\n  }).join('');\n}\n\n/* ---- MEDICINE ---- */\nfunction addMed(){\n  var nm=document.getElementById('me-nm').value.trim();\n  var ds=document.getElementById('me-ds').value.trim();\n  if(!nm){toast('Inserisci il nome del farmaco','');return;}\n  var fs=document.querySelector('#me-fq .SL');\n  var fq=fs?parseInt(fs.getAttribute('data-val'),10):3;\n  if(!fq||fq<1) fq=1;\n  var m={id:Date.now().toString(),name:nm,dose:ds,freq:fq,ki:kidI()};\n  ST.meds.push(m); lsS('meds',ST.meds);\n  if(ST.db&&ST.usr) ST.db.collection('users').doc(ST.usr.uid).update({meds:ST.meds}).catch(function(){});\n  document.getElementById('me-nm').value=''; document.getElementById('me-ds').value='';\n  refMeds(); toast('Farmaco aggiunto',nm+' - '+fq+'x/giorno');\n}\nfunction medCount(mid,ci,kn,dayStart){\n  var next=dayStart+86400000; var c=0;\n  for(var j=0;j<ST.evs.length;j++){\n    var e=ST.evs[j];\n    if(e.type==='med'&&e.mid===mid&&e.ts>=dayStart&&e.ts<next&&(e.ki===ci||e.kn===kn)) c++;\n  }\n  return c;\n}\nfunction giveMed(mid){\n  var m=null; for(var i=0;i<ST.meds.length;i++){if(ST.meds[i].id===mid){m=ST.meds[i];break;}}\n  if(!m) return;\n  var fq=m.freq||3;\n  var tsOv=bdTs('me');\n  var ts=tsOv||Date.now();\n  var day=new Date(ts); day.setHours(0,0,0,0);\n  var ci=kidI(); var kn=kidNm();\n  var cnt=medCount(mid,ci,kn,day.getTime());\n  if(cnt>=fq){toast('Limite giornaliero raggiunto',m.name+': '+cnt+'/'+fq+' oggi');return;}\n  hideBackdate('me');\n  logEv('med',{mid:mid,mn:m.name,dose:m.dose},function(){refMeds();toast('Medicina registrata!',m.name+' - '+(cnt+1)+'/'+fq+' oggi');},tsOv);\n}\nfunction delMed(mid){\n  ST.meds=ST.meds.filter(function(m){return m.id!==mid;});\n  lsS('meds',ST.meds);\n  if(ST.db&&ST.usr) ST.db.collection('users').doc(ST.usr.uid).update({meds:ST.meds}).catch(function(){});\n  refMeds();\n}\nfunction refMeds(){\n  var el=document.getElementById('me-ls'); if(!el) return;\n  var ci=kidI();\n  var meds=ST.meds.filter(function(m){return m.ki===undefined||m.ki===ci;});\n  var tod=new Date(); tod.setHours(0,0,0,0); var kn=kidNm();\n  if(!meds.length){el.innerHTML='<div class=\"EMP\"><div>&#128138;<\u002Fdiv>Nessun farmaco. Aggiungine uno sotto.<\u002Fdiv>';return;}\n  el.innerHTML=meds.map(function(m){\n    var fq=m.freq||3;\n    var last=null; var cnt=0; var next=tod.getTime()+86400000;\n    for(var i=0;i<ST.evs.length;i++){\n      var e=ST.evs[i];\n      if(e.type==='med'&&e.mid===m.id&&e.ts>=tod.getTime()&&e.ts<next&&(e.ki===ci||e.kn===kn)){cnt++;if(!last) last=e;}\n    }\n    var done=cnt>=fq;\n    return '<div class=\"MI\">'+\n      '<div style=\"font-size:20px\">&#128138;<\u002Fdiv>'+\n      '<div class=\"MN\"><div class=\"MNM\">'+m.name+'<\u002Fdiv>'+\n      '<div class=\"MDS\">'+(m.dose?m.dose+' - ':'')+fq+'x/giorno<\u002Fdiv>'+\n      '<div class=\"MGV\" style=\"color:'+(done?'var(--grn)':'var(--t2)')+'\">Oggi: '+cnt+'/'+fq+(last?' - ultima '+fT(last.ts):'')+'<\u002Fdiv><\u002Fdiv>'+\n      (done?'<div style=\"display:flex;align-items:center;gap:5px;font-size:12px;color:var(--grn);font-weight:600\"><span style=\"font-size:16px\">&#10003;<\u002Fspan>Completo<\u002Fdiv>':'<button class=\"MAC\" onclick=\"giveMed(\\''+m.id+'\\')\">Dai<\u002Fbutton>')+\n      '<button onclick=\"delMed(\\''+m.id+'\\')\" style=\"background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;padding:4px\">&#128465;<\u002Fbutton>'+\n    '<\u002Fdiv>';\n  }).join('');\n}\n\n/* ---- VOICE ---- */\nfunction togVoice(){\n  var mic=document.getElementById('v-mic');\n  var st=document.getElementById('v-st');\n  var tm=document.getElementById('v-tm');\n  if(!ST.vrun){\n    ST.vrun=true; if(mic) mic.classList.add('RC');\n    if(st) st.textContent='Registrazione in corso...';\n    ST.    if(!ld&&evs[i].type==='diap') ld=evs[i];\n    if(!lse&&evs[i].type==='slpe') lse=evs[i];\n  }\n  var slp=ST.slpA&&(ST.slpA.ki===ci||ST.slpA.kn===kn);\n  var tod=new Date(); tod.setHours(0,0,0,0);\n  var meds=evs.filter(function(e){return e.type==='med'&&e.ts>=tod.getTime();});\n  var ns=evs.filter(function(e){return e.type==='note';}).slice(0,1);\n  var fa=lf?mAgo(lf.ts):999;\n  var fb=fa>180?'BAL':fa>120?'BWN':'BOK'; var fbl=fa>180?'Da fare':fa>120?'Presto':'OK';\n  var ht=document.getElementById('ha-ti'); if(ht) ht.textContent='Riepilogo: '+kn;\n  var htm=document.getElementById('ha-tm'); if(htm) htm.textContent=fDT(Date.now())+' - '+(ST.prof?ST.prof.name:'');\n  var hr=document.getElementById('ha-rw'); if(!hr) return;\n  var h=\n    '<div class=\"HR\"><div class=\"HI\">&#127868;<\u002Fdiv>'+\n    '<div class=\"HT\"><div class=\"HK\">Ultima poppata<\u002Fdiv>'+\n    '<div class=\"HV\">'+(lf?tAgo(lf.ts)+' fa - '+(lf.ml||'?')+'ml '+fFT(lf.ft)+((lf.st&&lf.dur)?' ('+fT(lf.st)+'-'+fT(lf.ts)+')':''):'Nessuna')+'<\u002Fdiv><\u002Fdiv>'+\n    '<span class=\"BDG '+fb+'\">'+fbl+'<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"HR\"><div class=\"HI\">&#129527;<\u002Fdiv>'+\n    '<div class=\"HT\"><div class=\"HK\">Ultimo pannolino<\u002Fdiv>'+\n    '<div class=\"HV\">'+(ld?tAgo(ld.ts)+' fa - '+fDT2(ld.dt):'Nessuno')+'<\u002Fdiv><\u002Fdiv>'+\n    '<span class=\"BDG BOK\">OK<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"HR\"><div class=\"HI\">&#127769;<\u002Fdiv>'+\n    '<div class=\"HT\"><div class=\"HK\">Sonno<\u002Fdiv>'+\n    '<div class=\"HV\">'+(slp?'Dorme da '+tAgo(ST.slpA.st):(lse?'Ultima: '+tAgo(lse.ts)+' fa':'Nessuna'))+'<\u002Fdiv><\u002Fdiv>'+\n    '<span class=\"BDG '+(slp?'BOK':'BWN')+'\">'+(slp?'Dorme':'Sveglio')+'<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"HR\"><div class=\"HI\">&#128138;<\u002Fdiv>'+\n    '<div class=\"HT\"><div class=\"HK\">Medicine oggi<\u002Fdiv>'+\n    '<div class=\"HV\">'+(meds.length?meds.map(function(m){return m.mn;}).join(', '):'Nessuna')+'<\u002Fdiv><\u002Fdiv>'+\n    '<span class=\"BDG BOK\">OK<\u002Fspan><\u002Fdiv>';\n  if(ns.length){var nt=(ns[0].tx||'').slice(0,60)+(((ns[0].tx||'').length>60)?'...':'');\n    h+='<div class=\"HR\"><div class=\"HI\">&#128221;<\u002Fdiv><div class=\"HT\"><div class=\"HK\">Ultima nota<\u002Fdiv><div class=\"HV\" style=\"font-style:italic\">'+nt+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';}\n  hr.innerHTML=h;\n}\nfunction sendHO(){\n  var nt=document.getElementById('ha-nt').value.trim();\n  if(nt) logEv('note',{nt:'ho',tx:'Passaggio turno: '+nt},function(){});\n  toast('Riepilogo inviato!','Tutta la famiglia e aggiornata');\n  var el=document.getElementById('ha-nt'); if(el) el.value='';\n}\n\n/* ---- CAREGIVERS ---- */\nfunction renderCGs(list){\n  ST.lastCGs=list; ST.syncErr=null;\n  var el=document.getElementById('fa-ls'); if(!el) return;\n  var sl=document.getElementById('fa-sl');\n  if(sl) sl.textContent=list.length+' caregiver - '+(ST.prof?ST.prof.fc:'');\n  var cols=['rgba(245,158,11,.12)','rgba(59,130,246,.12)','rgba(16,185,129,.12)','rgba(139,90,43,.1)'];\n  var tc=['var(--amb)','var(--blu)','var(--grn)','#8B5A2B'];\n  if(!list.length){el.innerHTML='<div class=\"EMP\">Nessun caregiver<\u002Fdiv>';return;}\n  el.innerHTML=list.map(function(cg,i){\n    var ini=((cg.name||'?').slice(0,2)).toUpperCase();\n    var isMe=ST.usr&&cg.email===ST.usr.email;\n    var ls=cg.lastSeen&&cg.lastSeen.toMillis?cg.lastSeen.toMillis():(cg.lastSeen||0);\n    var onl=ls&&(Date.now()-ls)<300000;\n    return '<div class=\"CGR\">'+\n      '<div class=\"CAV\" style=\"background:'+cols[i%4]+';color:'+tc[i%4]+'\">'+ini+'<\u002Fdiv>'+\n      '<div class=\"CNI\"><div class=\"CNN\">'+(cg.name||'Utente')+(isMe?' (tu)':'')+'<\u002Fdiv><div class=\"CNR\">'+(cg.email||'')+'<\u002Fdiv><\u002Fdiv>'+\n      '<span class=\"BDG '+(onl?'BOK':'')+'\" style=\"'+(onl?'':'background:var(--s3);color:var(--t3)')+'\">'+(onl?'Attivo':'Offline')+'<\u002Fspan>'+\n    '<\u002Fdiv>';\n  }).join('');\n  if(ST.db&&ST.usr&&ST.usr.uid){\n    ST.db.collection('users').doc(ST.usr.uid).update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});\n  }\n}\n\n/* ---- NAVIGATION ---- */\nfunction go(id){\n  var pr=document.querySelector('.SC.ON');\n  if(pr){pr.classList.add('PR');(function(p){setTimeout(function(){p.classList.remove('PR','ON');},220);})(pr);}\n  var nx=document.getElementById(id); if(!nx) return;\n  nx.classList.add('ON'); ST.psc=ST.sc; ST.sc=id;\n  if(id==='sc-ho') updHome();\n  if(id==='sc-fe'){restoreFeedT();hideBackdate('fe');}\n  if(id==='sc-st'){renderKS();runSearch();}\n  if(id==='sc-di'){updDiCnt();hideBackdate('di');}\n  if(id==='sc-sl'){updSlpTot();syncSlpUI();hideBackdate('sl');}\n  if(id==='sc-me'){refMeds();hideBackdate('me');}\n  if(id==='sc-ha'){updHO();renderKS();}\n  if(id==='sc-no') updNotes();\n  if(id==='sc-se') loadSeUI();\n  if(id==='sc-fa'){\n    editFCcancel();\n    var fc=document.getElementById('fa-code'); if(fc) fc.textContent=ST.prof?ST.prof.fc:'--';\n    if(!ST.fbOk){var fl=document.getElementById('fa-ls'); if(fl) fl.innerHTML='<div class=\"EMP\"><div>&#128246;<\u002Fdiv>Sync non attivo su questo dispositivo. Vai in Impostazioni &gt; Sincronizzazione e incolla la config Firebase.<\u002Fdiv>';}\n    if(ST.db&&ST.usr&&ST.usr.uid) ST.db.collection('users').doc(ST.usr.uid).update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});\n  }\n  highlightNav(id);\n  updKL();\n}\nfunction nav(sid){go(sid);}\nfunction highlightNav(id){\n  var sc=document.getElementById(id); if(!sc) return;\n  var bnv=sc.querySelector('.BNV'); if(!bnv) return;\n  bnv.querySelectorAll('.NBT').forEach(function(b){b.classList.toggle('ON',b.getAttribute('data-nav')===id);});\n}\n\n/* ---- CLOCK ---- */\nfunction startClock(){\n  var ids=['t-su','t-ho','t-fe','t-di','t-sl','t-me','t-ha','t-no','t-fa','t-se','t-st'];\n  setInterval(function(){\n    var t=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});\n    ids.forEach(function(id){var el=document.getElementById(id);if(el) el.textContent=t;});\n  },1000);\n  setInterval(function(){\n    var on=document.querySelector('.SC.ON');\n    if(!on) return;\n    if(on.id==='sc-ho') updHome();\n    else if(on.id==='sc-ha') updHO();\n    else if(on.id==='sc-fa'&&ST.lastCGs) renderCGs(ST.lastCGs);\n  },30000);\n}\n\n/* ---- TOAST ---- */\nvar tTm;\nfunction toast(ttl,sub){\n  var el=document.getElementById('TST');\n  var tt=document.getElementById('t-ttl');\n  var ts=document.getElementById('t-sub');\n  if(tt) tt.textContent=ttl;\n  if(ts) ts.textContent=sub||'';\n  if(el) el.classList.add('ON');\n  clearTimeout(tTm);\n  tTm=setTimeout(function(){if(el) el.classList.remove('ON');},2800);\n}\n\n/* ---- HELPERS ---- */\nfunction fSec(s){var m=Math.floor(s/60),sc=s%60;return (m<10?'0':'')+m+':'+(sc<10?'0':'')+sc;}\nfunction fHMS(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(sc<10?'0':'')+sc;}\nfunction fT(ts){if(!ts) return '--';var t=ts&&ts.toMillis?ts.toMillis():ts;return new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}\nfunction fDT(ts){return new Date(ts).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})+' '+fT(ts);}\nfunction fDur(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?h+'h '+(m<10?'0':'')+m+'m':m+'m '+(s%60)+'s';}\nfunction mAgo(ts){if(!ts) return 9999;var t=ts&&ts.toMillis?ts.toMillis():ts;return Math.floor((Date.now()-t)/60000);}\nfunction tAgo(ts){var m=mAgo(ts);if(m<1) return 'adesso';if(m<60) return m+'m';var h=Math.floor(m/60),m2=m%60;return h+'h'+(m2>0?' '+m2+'m':'');}\nfunction fFT(t){var mp={bottle:'Biberon',breast_l:'Seno Sin.',breast_r:'Seno Dx.'};return mp[t]||t||'--';}\nfunction fDiap(t){var mp={pee:'Pip\\u00ec',poop:'Popo',both:'Pip\\u00ec+Popo'};return mp[t]||t||'--';}\nfunction fDT2(t){return fDiap(t);}\nfunction fDay(ts){if(!ts) return '--';var t=ts&&ts.toMillis?ts.toMillis():ts;return new Date(t).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});}\nfunction eCol(t){var mp={feed:'var(--amb)',diap:'var(--t3)',slps:'var(--grn)',slpe:'var(--grn)',med:'var(--red)',note:'var(--blu)'};return mp[t]||'var(--t3)';}\nfunction eLbl(e){\n  if(e.type==='feed'){var ftt=(e.st&&e.dur)?' ('+fT(e.st)+'-'+fT(e.ts)+')':'';return 'Poppata: '+(e.ml||'?')+'ml - '+fFT(e.ft)+ftt;}\n  if(e.type==='diap') return 'Pannolino: '+fDiap(e.dt);\n  if(e.type==='slps') return 'Inizio nanna';\n  if(e.type==='slpe') return 'Fine nanna: '+fDur(e.dur||0);\n  if(e.type==='med') return (e.mn||'Medicina');\n  if(e.type==='note') return 'Nota: '+(e.tx||'').slice(0,30);\n  return e.type;\n}\nfunction setLt(t){var el=document.getElementById('ltxt');if(el) el.textContent=t;}\nfunction hideLdr(){var l=document.getElementById('LDR');if(l){l.style.opacity='0';setTimeout(function(){l.style.display='none';},400);}}\n\nwindow.addEventListener('offline',function(){setSync(false);});\nwindow.addEventListener('online',function(){if(ST.fbOk&&ST.prof&&ST.prof.fc){subEvs();setSync(true);}});\n\n/* ---- FIREBASE CONFIG ---- */\nfunction saveFbCfg(){\n  var raw=(document.getElementById('se-fbcfg')||{}).value||'';\n  raw=raw.trim();\n  if(!raw){toast('Incolla prima la configurazione','');return;}\n  var cfg={};\n  var re=/([A-Za-z0-9_]+)\\s*:\\s*[\"']([^\"']*)[\"']/g; var mm;\n  while((mm=re.exec(raw))){cfg[mm[1]]=mm[2];}\n  if(!cfg.apiKey||!cfg.projectId){toast('Config non valida','Servono almeno apiKey e projectId');return;}\n  lsS('fbcfg',cfg);\n  toast('Configurazione salvata','Riavvio in corso...');\n  setTimeout(function(){location.reload();},900);\n}\n\n/* ---- SEARCH ---- */\nfunction runSearch(){\n  var el=document.getElementById('st-ls'); if(!el) return;\n  var q=((document.getElementById('st-q')||{}).value||'').toLowerCase().trim();\n  var tsel=document.querySelector('#st-tp .SL'); var tp=tsel?tsel.getAttribute('data-val'):'all';\n  var ci=kidI(); var kn=kidNm();\n  var list=ST.evs.filter(function(e){\n    if(!(e.ki===ci||e.kn===kn)) return false;\n    if(tp==='sleep'){if(e.type!=='slps'&&e.type!=='slpe') return false;}\n    else if(tp!=='all'&&e.type!==tp) return false;\n    if(q){var hay=(eLbl(e)+' '+(e.cg||'')+' '+(e.tx||'')+' '+(e.mn||'')).toLowerCase();if(hay.indexOf(q)<0) return false;}\n    return true;\n  });\n  if(!list.length){el.innerHTML='<div class=\"EMP\"><div>&#128269;<\u002Fdiv>Nessun risultato<\u002Fdiv>';return;}\n  el.innerHTML=list.map(function(e){\n    return '<div class=\"EI\">'+\n      '<div class=\"ED\" style=\"background:'+eCol(e.type)+'\"><\u002Fdiv>'+\n      '<div class=\"ET\">'+eLbl(e)+'<\u002Fdiv>'+\n      '<div style=\"text-align:right\"><div class=\"EC\">'+fT(e.ts)+'<\u002Fdiv><div class=\"EW\">'+fDay(e.ts)+' - '+(e.cg||'')+'<\u002Fdiv><\u002Fdiv>'+\n    '<\u002Fdiv>';\n  }).join('');\n}\n\n/* ---- EXPOSE GLOBALS ---- */\nwindow.toggleAuth=toggleAuth;\nwindow.doLogin=doLogin;\nwindow.doLogout=doLogout;\nwindow.saveSetup=saveSetup;\nwindow.saveKids=saveKids;\nwindow.editName=editName;\nwindow.copyFC=copyFC;\nwindow.editFC=editFC;\nwindow.editFCcancel=editFCcancel;\nwindow.saveFCin=saveFCin;\nwindow.go=go;\nwindow.nav=nav;\nwindow.selPil=selPil;\nwindow.chQty=chQty;\nwindow.setQty=setQty;\nwindow.togFT=togFT;\nwindow.rstFT=rstFT;\nwindow.logFeed=logFeed;\nwindow.selDi=selDi;\nwindow.logDi=logDi;\nwindow.startSlp=startSlp;\nwindow.endSlp=endSlp;\nwindow.addMed=addMed;\nwindow.giveMed=giveMed;\nwindow.delMed=delMed;\nwindow.togVoice=togVoice;\nwindow.saveTxtNote=saveTxtNote;\nwindow.sendHO=sendHO;\nwindow.saveFbCfg=saveFbCfg;\nwindow.runSearch=runSearch;\nwindow.togBackdate=togBackdate;\nwindow.addPastSleep=addPastSleep;\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
